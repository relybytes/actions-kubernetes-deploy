name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-alias-tags
  cancel-in-progress: false

jobs:
  move-alias-tags:
    name: Move the major and minor alias tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move vX and vX.Y to this commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Callers pin the action as @v1, so a fix that is only tagged vX.Y.Z
          # stays invisible to them until the alias moves. Moving it here makes
          # that impossible to forget.
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a vX.Y.Z tag"
            exit 1
          fi

          MAJOR="v${BASH_REMATCH[1]}"
          MINOR="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for alias_tag in "$MAJOR" "$MINOR"; do
            echo "Moving $alias_tag to $RELEASE_TAG ($GITHUB_SHA)"
            git tag --force --annotate "$alias_tag" --message "Alias tag for $RELEASE_TAG"
            git push --force origin "refs/tags/$alias_tag"
          done

          echo "$MAJOR and $MINOR now point at $RELEASE_TAG"
