name: "Kubernetes Deploy by RelyBytes"
description: "Deploy services to a Kubernetes cluster by applying YAML manifests with namespace and rollout management"
author: "RelyBytes"

branding:
  icon: "cloud"
  color: "blue"

inputs:
  kubeconfig:
    description: "Kubeconfig content (raw YAML or base64-encoded)"
    required: true

  context:
    description: "Kubeconfig context to use (optional)"
    required: false
    default: ""

  namespace:
    description: "Target Kubernetes namespace"
    required: true

  create_namespace:
    description: "Create the namespace if it does not exist. Needs cluster-scoped permission on namespaces; set it to false when the credentials are namespace-scoped."
    required: false
    default: "true"

  manifests:
    description: "Path(s) to manifest file(s) or directory (newline or comma separated)"
    required: true

  kustomize:
    description: "Apply manifests using kustomize (-k). Not compatible with replacements or env_substitution."
    required: false
    default: "false"

  replacements:
    description: |
      Newline-separated placeholder replacements in KEY=VALUE format.
      Example:
        __IMAGE__=ghcr.io/myorg/api:sha
        __VERSION__=1.2.3
        __APP_ENV__=production
        __HOST__=app.example.com
    required: false
    default: ""

  set_image:
    description: |
      Newline-separated 'resource=container=image' entries for kubectl set image.
      Example:
        deployment/api=app=ghcr.io/myorg/api:sha
        deployment/worker=worker=ghcr.io/myorg/worker:sha
    required: false
    default: ""

  env_substitution:
    description: "Apply envsubst to manifests using current environment variables. Not compatible with kustomize."
    required: false
    default: "false"

  validate:
    description: "Run kubectl with --validate=true"
    required: false
    default: "true"

  dry_run:
    description: "Run kubectl apply in dry-run mode (none|client|server)"
    required: false
    default: "none"

  prune:
    description: "Enable kubectl --prune for declarative cleanup. Every manifest is then applied in a single kubectl invocation."
    required: false
    default: "false"

  prune_label:
    description: "Label selector required when prune is enabled"
    required: false
    default: ""

  wait:
    description: "Wait for rollout to complete after apply"
    required: false
    default: "true"

  wait_resources:
    description: |
      Newline-separated resources to wait on (e.g. deployment/api).
      When empty, the action waits on the rollout-capable resources
      (deployment, statefulset, daemonset) that this run applied, not on
      everything in the namespace. A run whose manifests contain no such
      resource therefore waits on nothing, even when set_image changed an
      image: list the resources here when that is the case.
    required: false
    default: ""

  wait_timeout:
    description: "Timeout for rollout wait (e.g. 300s, 5m)"
    required: false
    default: "300s"

  kubectl_version:
    description: "kubectl version to install (e.g. v1.30.0). Empty installs latest stable."
    required: false
    default: ""

  create_registry_secret:
    description: "Create or update a Kubernetes imagePullSecret for private registries"
    required: false
    default: "false"

  registry_server:
    description: "Container registry server, for example ghcr.io or registry.example.com"
    required: false
    default: ""

  registry_username:
    description: "Container registry username"
    required: false
    default: ""

  registry_password:
    description: "Container registry password or token"
    required: false
    default: ""

  registry_email:
    description: "Container registry email"
    required: false
    default: "devops@relybytes.com"

  registry_secret_name:
    description: "Kubernetes imagePullSecret name to create or update"
    required: false
    default: ""

outputs:
  applied_resources:
    description: "Resources applied to the cluster, one per line, empty when nothing was applied"
    value: ${{ steps.apply.outputs.applied_resources }}

  rollout_status:
    description: "Rollout status (success|failed|skipped). Always one of the three, 'skipped' when wait is false, when dry_run is not none, or when nothing rollout-capable was applied."
    value: ${{ steps.rollout.outputs.rollout_status }}

  deployment_time:
    description: "Timestamp of the deployment"
    value: ${{ steps.apply.outputs.deployment_time }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_KUBECONFIG: ${{ inputs.kubeconfig }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_MANIFESTS: ${{ inputs.manifests }}
        INPUT_KUSTOMIZE: ${{ inputs.kustomize }}
        INPUT_REPLACEMENTS: ${{ inputs.replacements }}
        INPUT_ENV_SUBSTITUTION: ${{ inputs.env_substitution }}
        INPUT_PRUNE: ${{ inputs.prune }}
        INPUT_PRUNE_LABEL: ${{ inputs.prune_label }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_CREATE_REGISTRY_SECRET: ${{ inputs.create_registry_secret }}
        INPUT_REGISTRY_SERVER: ${{ inputs.registry_server }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        INPUT_REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        INPUT_REGISTRY_SECRET_NAME: ${{ inputs.registry_secret_name }}
      run: |
        set -euo pipefail

        echo "::group::Validating inputs"

        if [[ -z "$INPUT_KUBECONFIG" ]]; then
          echo "::error::kubeconfig is required"
          exit 1
        fi

        if [[ -z "$INPUT_NAMESPACE" ]]; then
          echo "::error::namespace is required"
          exit 1
        fi

        if [[ ! "$INPUT_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
          echo "::error::Invalid namespace '$INPUT_NAMESPACE' (must follow DNS-1123 label rules)"
          exit 1
        fi

        if [[ -z "$INPUT_MANIFESTS" ]]; then
          echo "::error::manifests is required"
          exit 1
        fi

        case "$INPUT_KUSTOMIZE" in
          true|false) ;;
          *)
            echo "::error::kustomize must be one of: true, false"
            exit 1
            ;;
        esac

        # kustomize renders the manifests itself, so the placeholder and envsubst
        # passes never see them. Failing here is better than the old behaviour,
        # which accepted both inputs and silently deployed unsubstituted
        # manifests.
        if [[ "$INPUT_KUSTOMIZE" == "true" ]]; then
          if [[ -n "$INPUT_REPLACEMENTS" ]]; then
            echo "::error::replacements cannot be combined with kustomize: kustomize renders the manifests, so the placeholders would reach the cluster unreplaced. Use a kustomize image or configMap generator, or turn kustomize off."
            exit 1
          fi

          if [[ "$INPUT_ENV_SUBSTITUTION" == "true" ]]; then
            echo "::error::env_substitution cannot be combined with kustomize: envsubst would never see the rendered manifests. Turn one of the two off."
            exit 1
          fi
        fi

        if [[ "$INPUT_PRUNE" == "true" ]] && [[ -z "$INPUT_PRUNE_LABEL" ]]; then
          echo "::error::prune_label is required when prune is enabled"
          exit 1
        fi

        case "$INPUT_DRY_RUN" in
          none|client|server) ;;
          *)
            echo "::error::dry_run must be one of: none, client, server"
            exit 1
            ;;
        esac

        case "$INPUT_CREATE_REGISTRY_SECRET" in
          true|false) ;;
          *)
            echo "::error::create_registry_secret must be one of: true, false"
            exit 1
            ;;
        esac

        if [[ "$INPUT_CREATE_REGISTRY_SECRET" == "true" ]]; then
          if [[ -z "$INPUT_REGISTRY_SERVER" ]]; then
            echo "::error::registry_server is required when create_registry_secret is true"
            exit 1
          fi

          if [[ -z "$INPUT_REGISTRY_USERNAME" ]]; then
            echo "::error::registry_username is required when create_registry_secret is true"
            exit 1
          fi

          if [[ -z "$INPUT_REGISTRY_PASSWORD" ]]; then
            echo "::error::registry_password is required when create_registry_secret is true"
            exit 1
          fi

          if [[ -z "$INPUT_REGISTRY_SECRET_NAME" ]]; then
            echo "::error::registry_secret_name is required when create_registry_secret is true"
            exit 1
          fi

          if [[ ! "$INPUT_REGISTRY_SECRET_NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "::error::Invalid registry_secret_name '$INPUT_REGISTRY_SECRET_NAME' (must follow DNS-1123 label rules)"
            exit 1
          fi
        fi

        echo "Inputs validated successfully"
        echo "::endgroup::"

    - name: Install kubectl
      shell: bash
      env:
        KUBECTL_VERSION: ${{ inputs.kubectl_version }}
      run: |
        set -euo pipefail

        echo "::group::Installing kubectl"

        # The binary is also run, not only looked up: a kubectl left broken in a
        # shared directory by an earlier job satisfied 'command -v' and there was
        # no way for a later job to repair it.
        if [[ -z "$KUBECTL_VERSION" ]] && command -v kubectl >/dev/null 2>&1 && kubectl version --client >/dev/null 2>&1; then
          echo "kubectl already available:"
          kubectl version --client
          echo "::endgroup::"
          exit 0
        fi

        # The right binary for this machine, instead of the amd64 one for
        # everybody: self-hosted runners are not all amd64 Linux.
        case "$(uname -m)" in
          x86_64|amd64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          armv7l|armv7) ARCH="arm" ;;
          ppc64le) ARCH="ppc64le" ;;
          s390x) ARCH="s390x" ;;
          *)
            echo "::error::Unsupported runner architecture '$(uname -m)'. Preinstall kubectl on this runner."
            exit 1
            ;;
        esac

        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"

        case "$OS" in
          linux|darwin) ;;
          *)
            echo "::error::Unsupported runner operating system '$OS'. Preinstall kubectl on this runner."
            exit 1
            ;;
        esac

        if ! command -v curl >/dev/null 2>&1; then
          echo "::error::kubectl is missing and curl is not available to download it. Preinstall kubectl, or curl, on this runner."
          exit 1
        fi

        if [[ -z "$KUBECTL_VERSION" ]]; then
          if ! KUBECTL_VERSION="$(curl -fsSL --retry 3 https://dl.k8s.io/release/stable.txt)"; then
            echo "::error::Could not read the current stable kubectl version from dl.k8s.io"
            exit 1
          fi
        fi

        # A per-job directory prepended to PATH, never /usr/local/bin: jobs from
        # different repositories run as the same user on these runners, so
        # installing there would replace the kubectl every other job is using.
        # Nothing machine-wide is touched and no sudo is needed.
        INSTALL_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/kubectl.XXXXXX")"
        chmod 700 "$INSTALL_DIR"
        DOWNLOAD_URL="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/${OS}/${ARCH}/kubectl"

        echo "Installing kubectl $KUBECTL_VERSION for $OS/$ARCH into $INSTALL_DIR"

        # -f, so an HTTP error page is never saved and installed as the binary.
        if ! curl -fsSL --retry 3 -o "$INSTALL_DIR/kubectl" "$DOWNLOAD_URL"; then
          echo "::error::Download of kubectl failed: $DOWNLOAD_URL"
          rm -rf "$INSTALL_DIR"
          exit 1
        fi

        chmod +x "$INSTALL_DIR/kubectl"

        if ! "$INSTALL_DIR/kubectl" version --client >/dev/null 2>&1; then
          echo "::error::The downloaded file does not run as kubectl, so it was not installed: $DOWNLOAD_URL"
          rm -rf "$INSTALL_DIR"
          exit 1
        fi

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        export PATH="$INSTALL_DIR:$PATH"

        kubectl version --client
        echo "::endgroup::"

    - name: Ensure envsubst
      shell: bash
      if: inputs.env_substitution == 'true' && inputs.kustomize != 'true'
      run: |
        set -euo pipefail

        echo "::group::Ensuring envsubst"

        if command -v envsubst >/dev/null 2>&1; then
          echo "envsubst already available"
          echo "::endgroup::"
          exit 0
        fi

        # No 'sudo apt-get install gettext-base'. On a shared self-hosted runner
        # that needs sudo, fights the dpkg lock with the other jobs, and changes
        # the package state of a machine this action does not own. A python3
        # stand-in in a per-job directory on PATH does the same substitution with
        # none of that.
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::env_substitution needs envsubst (package gettext-base) or python3 on the runner, and neither is available. Preinstall one of the two."
          exit 1
        fi

        SHIM_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/envsubst.XXXXXX")"
        chmod 700 "$SHIM_DIR"

        cat > "$SHIM_DIR/envsubst" <<'SHIM'
        #!/usr/bin/env python3
        """Stand-in for GNU envsubst: substitutes $VAR and ${VAR} from the
        environment on stdin and writes the result to stdout. Like envsubst, a
        variable that is not set becomes the empty string and anything that is not
        a variable reference is copied through untouched."""
        import os
        import re
        import sys

        REFERENCE = re.compile(r"\$(?:\{([A-Za-z_][A-Za-z0-9_]*)\}|([A-Za-z_][A-Za-z0-9_]*))")


        def value(match: "re.Match[str]") -> str:
            return os.environ.get(match.group(1) or match.group(2), "")


        sys.stdout.write(REFERENCE.sub(value, sys.stdin.read()))
        SHIM

        chmod 700 "$SHIM_DIR/envsubst"
        echo "$SHIM_DIR" >> "$GITHUB_PATH"

        echo "envsubst is not installed: using a python3 stand-in from $SHIM_DIR"
        echo "::endgroup::"

    - name: Configure kubeconfig
      id: kubeconfig
      shell: bash
      env:
        KCONFIG: ${{ inputs.kubeconfig }}
        KCONTEXT: ${{ inputs.context }}
      run: |
        set -euo pipefail

        echo "::group::Configuring kubeconfig"

        # One file per run, never $HOME/.kube/config: jobs sharing a self-hosted
        # runner share $HOME, and one job's cleanup would delete the file another
        # job is still reading, failing its rollout wait on a deploy that worked.
        KUBECONFIG_PATH="$(mktemp "${RUNNER_TEMP:-/tmp}/kubeconfig.XXXXXX")"
        echo "path=$KUBECONFIG_PATH" >> "$GITHUB_OUTPUT"

        if printf '%s\n' "$KCONFIG" | grep -q "^apiVersion:"; then
          printf '%s\n' "$KCONFIG" > "$KUBECONFIG_PATH"
        elif printf '%s\n' "$KCONFIG" | base64 -d 2>/dev/null | grep -q "^apiVersion:"; then
          printf '%s\n' "$KCONFIG" | base64 -d > "$KUBECONFIG_PATH"
        else
          echo "::error::kubeconfig is neither valid YAML nor base64-encoded YAML"
          exit 1
        fi

        chmod 600 "$KUBECONFIG_PATH"

        # GitHub masks the value the caller passed, not what it decodes to, so a
        # base64 kubeconfig leaves its client key or bearer token unmasked for the
        # rest of the job. Only the credential fields are masked: masking lines
        # such as 'kind: Config' would just fill the log with asterisks.
        while IFS= read -r secret_value; do
          if [[ -n "$secret_value" ]]; then
            echo "::add-mask::$secret_value"
          fi
        done < <(sed -n -E 's/^[[:space:]]*(client-key-data|client-certificate-data|token|password|id-token|refresh-token|client-secret):[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\2/p' "$KUBECONFIG_PATH")

        echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"
        export KUBECONFIG="$KUBECONFIG_PATH"

        if [[ -n "$KCONTEXT" ]]; then
          kubectl config use-context "$KCONTEXT"
        fi

        # Assigned first and then checked: inside 'echo "$(kubectl ...)"' a
        # failing command substitution does not propagate under set -e, so a
        # kubeconfig without a current context used to be reported only as an
        # empty line here and as a confusing error several steps later.
        CONTEXT_ERR="$(mktemp "${RUNNER_TEMP:-/tmp}/kubecontext.XXXXXX")"
        CURRENT_CONTEXT=""
        CURRENT_CONTEXT="$(kubectl config current-context 2>"$CONTEXT_ERR")" || true

        if [[ -z "$CURRENT_CONTEXT" ]]; then
          echo "::error::The kubeconfig has no usable current context. Set 'current-context' in the kubeconfig secret, or pass the 'context' input with the name of the context to use."
          if [[ -s "$CONTEXT_ERR" ]]; then
            echo "kubectl reported:"
            cat "$CONTEXT_ERR"
          fi
          rm -f "$CONTEXT_ERR"
          exit 1
        fi

        rm -f "$CONTEXT_ERR"

        echo "Active context: $CURRENT_CONTEXT"
        echo "::endgroup::"

    - name: Ensure namespace
      shell: bash
      env:
        NS: ${{ inputs.namespace }}
        CREATE_NS: ${{ inputs.create_namespace }}
      run: |
        set -euo pipefail

        echo "::group::Ensuring namespace '$NS'"

        if [[ "$CREATE_NS" == "true" ]]; then
          if kubectl get namespace "$NS" >/dev/null 2>&1; then
            echo "Namespace '$NS' exists"
          else
            # Two jobs deploying into the same namespace can both find it missing
            # here, so the creation goes through the idempotent create|apply
            # shape: the job that loses the race updates the namespace instead of
            # failing with AlreadyExists.
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            echo "Namespace '$NS' created"
          fi
        else
          # stderr is captured and printed: it is the only place that says why the
          # check did not answer 'yes'.
          CAN_I_ERR="$(mktemp "${RUNNER_TEMP:-/tmp}/can-i.XXXXXX")"
          CAN_ACCESS=""
          CAN_ACCESS="$(kubectl auth can-i get pods --namespace "$NS" 2>"$CAN_I_ERR")" || true

          if [[ "$CAN_ACCESS" != "yes" ]]; then
            echo "::error::Cannot confirm access to namespace '$NS'. 'kubectl auth can-i get pods' answered '${CAN_ACCESS:-<nothing>}'. Possible causes: the namespace does not exist, the credentials have no RBAC permission in it, the kubeconfig token or client certificate has expired, or the API server is not reachable from this runner."
            if [[ -s "$CAN_I_ERR" ]]; then
              echo "kubectl reported:"
              cat "$CAN_I_ERR"
            fi
            rm -f "$CAN_I_ERR"
            exit 1
          fi

          rm -f "$CAN_I_ERR"
          echo "Namespace '$NS' is accessible"
        fi

        echo "::endgroup::"

    - name: Create or update registry pull secret
      shell: bash
      if: inputs.create_registry_secret == 'true' && inputs.dry_run == 'none'
      env:
        NS: ${{ inputs.namespace }}
        REGISTRY_SERVER: ${{ inputs.registry_server }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        REGISTRY_EMAIL: ${{ inputs.registry_email }}
        REGISTRY_SECRET_NAME: ${{ inputs.registry_secret_name }}
      run: |
        set -euo pipefail

        echo "::group::Creating or updating registry pull secret"

        echo "::add-mask::$REGISTRY_PASSWORD"

        # Nothing secret goes on a command line. On these runners every job can
        # read /proc/<pid>/cmdline of every other job, and
        # 'kubectl create secret --docker-password=...' put the registry password
        # there in clear for as long as the process lived. printf and base64 are a
        # builtin and a stdin reader, so the password only ever travels through
        # the environment and through pipes.
        REGISTRY_AUTH="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
        export REGISTRY_AUTH
        echo "::add-mask::$REGISTRY_AUTH"

        # A real JSON encoder, never printf: a password containing a double quote
        # or a backslash has to be escaped to stay usable.
        if command -v jq >/dev/null 2>&1; then
          DOCKERCONFIG_JSON="$(jq -nc '{auths: {($ENV.REGISTRY_SERVER): {username: $ENV.REGISTRY_USERNAME, password: $ENV.REGISTRY_PASSWORD, email: $ENV.REGISTRY_EMAIL, auth: $ENV.REGISTRY_AUTH}}}')"
        elif command -v python3 >/dev/null 2>&1; then
          DOCKERCONFIG_JSON="$(python3 -c 'import json, os; print(json.dumps({"auths": {os.environ["REGISTRY_SERVER"]: {"username": os.environ["REGISTRY_USERNAME"], "password": os.environ["REGISTRY_PASSWORD"], "email": os.environ["REGISTRY_EMAIL"], "auth": os.environ["REGISTRY_AUTH"]}}}))')"
        else
          echo "::error::create_registry_secret needs jq or python3 on the runner to build the dockerconfigjson without putting the password on a command line. Install one of the two."
          exit 1
        fi

        DOCKERCONFIG_B64="$(printf '%s' "$DOCKERCONFIG_JSON" | base64 | tr -d '\n')"
        unset DOCKERCONFIG_JSON
        echo "::add-mask::$DOCKERCONFIG_B64"

        # The manifest only interpolates base64 output and two names already
        # validated as DNS-1123 labels, and it is piped straight into kubectl, so
        # it never lands on disk. apply creates or updates, as before.
        printf '%s\n' \
          'apiVersion: v1' \
          'kind: Secret' \
          'metadata:' \
          "  name: $REGISTRY_SECRET_NAME" \
          "  namespace: $NS" \
          'type: kubernetes.io/dockerconfigjson' \
          'data:' \
          "  .dockerconfigjson: $DOCKERCONFIG_B64" \
          | kubectl --namespace "$NS" apply -f -

        echo "Registry pull secret '$REGISTRY_SECRET_NAME' created or updated in namespace '$NS'"
        echo "::endgroup::"

    - name: Prepare manifests
      id: prepare
      shell: bash
      env:
        MANIFESTS: ${{ inputs.manifests }}
        REPLACEMENTS: ${{ inputs.replacements }}
        ENV_SUBST: ${{ inputs.env_substitution }}
        KUSTOMIZE: ${{ inputs.kustomize }}
      run: |
        set -euo pipefail

        echo "::group::Preparing manifests"

        # Whitespace trimming without xargs: xargs applies shell quote
        # processing, so it ate backslashes, stripped quotes, and exited 1 on an
        # unmatched apostrophe, killing the step with a message about xargs.
        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        # Under RUNNER_TEMP, like the kubeconfig: these files are the fully
        # rendered manifests, so they hold whatever the caller substituted into
        # them, and RUNNER_TEMP belongs to this job while /tmp is shared with
        # every other job on the runner.
        WORK_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/manifests.XXXXXX")"
        chmod 700 "$WORK_DIR"
        echo "work_dir=$WORK_DIR" >> "$GITHUB_OUTPUT"

        readarray -t RAW_PATHS < <(printf '%s\n' "$MANIFESTS" | tr ',' '\n')

        MANIFEST_PATHS=()

        for raw in "${RAW_PATHS[@]}"; do
          candidate="$(trim "$raw")"
          [[ -z "$candidate" ]] && continue
          MANIFEST_PATHS+=("$candidate")
        done

        # Checked before the branches: a manifests input of ',' used to reach the
        # kustomize branch with nothing to apply and report a successful deploy.
        if [[ ${#MANIFEST_PATHS[@]} -eq 0 ]]; then
          echo "::error::manifests contains no usable path"
          exit 1
        fi

        PROCESSED_PATHS=()
        PATH_INDEX=0

        for p in "${MANIFEST_PATHS[@]}"; do
          if [[ ! -e "$p" ]]; then
            echo "::error::Manifest path '$p' does not exist"
            exit 1
          fi

          if [[ "$KUSTOMIZE" == "true" ]]; then
            PROCESSED_PATHS+=("$p")
            continue
          fi

          # One numbered subdirectory per input path. Copying by basename made
          # two inputs both called deployment.yaml collide, so one of them was
          # applied twice and the other was never applied at all.
          PATH_INDEX=$((PATH_INDEX + 1))
          DEST_DIR="$WORK_DIR/$PATH_INDEX"
          mkdir -p "$DEST_DIR"
          DEST="$DEST_DIR/$(basename "$p")"

          if [[ -d "$p" ]]; then
            cp -r "$p" "$DEST"
          else
            cp "$p" "$DEST"
          fi

          # The copy inherits the workspace permissions, usually world-readable,
          # while the rendered result holds whatever was substituted into it.
          chmod -R go-rwx "$DEST_DIR"

          PROCESSED_PATHS+=("$DEST")
        done

        if [[ "$KUSTOMIZE" == "true" ]]; then
          if [[ ${#PROCESSED_PATHS[@]} -eq 0 ]]; then
            echo "::error::No kustomize path to apply"
            exit 1
          fi

          printf '%s\n' "${PROCESSED_PATHS[@]}" > "$WORK_DIR/manifests.list"

          echo "Kustomize paths to apply:"
          printf ' - %s\n' "${PROCESSED_PATHS[@]}"
          echo "Prepared ${#PROCESSED_PATHS[@]} kustomize path(s)"
          echo "::endgroup::"
          exit 0
        fi

        APPLY_FILES=()

        for target in "${PROCESSED_PATHS[@]}"; do
          if [[ -d "$target" ]]; then
            while IFS= read -r -d '' f; do
              APPLY_FILES+=("$f")
            done < <(find "$target" -type f \( -name "*.yml" -o -name "*.yaml" -o -name "*.json" \) -print0 | sort -z)
          elif [[ "$target" == *.yaml || "$target" == *.yml || "$target" == *.json ]]; then
            APPLY_FILES+=("$target")
          else
            echo "::error::Manifest path '$target' is not a .yaml, .yml, or .json file"
            exit 1
          fi
        done

        if [[ ${#APPLY_FILES[@]} -eq 0 ]]; then
          echo "::error::No manifest files found. Expected .yaml, .yml, or .json files."
          exit 1
        fi

        escape_sed_replacement() {
          printf '%s' "$1" | sed -e 's/[\/&|]/\\&/g'
        }

        escape_sed_pattern() {
          # The left-hand side of the substitution is a basic regular expression,
          # so a placeholder such as __A.B__ used to match any character in that
          # position. '|' is deliberately left alone: it is already literal in a
          # BRE and '\|' would turn it into GNU alternation.
          printf '%s' "$1" | sed -e 's/[][\.*^$]/\\&/g'
        }

        # A control character as the s/// delimiter, so a placeholder or a value
        # containing '|' cannot end the substitution early and abort sed.
        SED_DELIM=$'\001'

        if [[ -n "$REPLACEMENTS" ]]; then
          echo "Applying generic placeholder replacements"

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(trim "$line")"

            [[ -z "$line" ]] && continue
            [[ "$line" == \#* ]] && continue

            if [[ "$line" != *"="* ]]; then
              echo "::error::Invalid replacement '$line'. Expected KEY=VALUE"
              exit 1
            fi

            KEY="$(trim "${line%%=*}")"
            VALUE="${line#*=}"

            if [[ -z "$KEY" ]]; then
              echo "::error::Invalid replacement '$line'. Empty key"
              exit 1
            fi

            SAFE_KEY="$(escape_sed_pattern "$KEY")"
            SAFE_VALUE="$(escape_sed_replacement "$VALUE")"

            echo "Replacing placeholder '$KEY'"

            for f in "${APPLY_FILES[@]}"; do
              sed -i "s${SED_DELIM}${SAFE_KEY}${SED_DELIM}${SAFE_VALUE}${SED_DELIM}g" "$f"
            done
          done <<< "$REPLACEMENTS"
        fi

        if [[ "$ENV_SUBST" == "true" ]]; then
          echo "Running envsubst on manifests"

          for f in "${APPLY_FILES[@]}"; do
            # Also under RUNNER_TEMP: this file holds the rendered manifest.
            tmp="$(mktemp "${RUNNER_TEMP:-/tmp}/envsubst.XXXXXX")"
            envsubst < "$f" > "$tmp"
            mv "$tmp" "$f"
          done
        fi

        printf '%s\n' "${APPLY_FILES[@]}" > "$WORK_DIR/manifests.list"

        echo "Manifest files to apply:"
        printf ' - %s\n' "${APPLY_FILES[@]}"

        echo "Prepared ${#APPLY_FILES[@]} manifest file(s)"
        echo "::endgroup::"

    - name: Apply manifests
      id: apply
      shell: bash
      env:
        NS: ${{ inputs.namespace }}
        VALIDATE: ${{ inputs.validate }}
        DRY_RUN: ${{ inputs.dry_run }}
        PRUNE: ${{ inputs.prune }}
        PRUNE_LABEL: ${{ inputs.prune_label }}
        KUSTOMIZE: ${{ inputs.kustomize }}
        WORK_DIR: ${{ steps.prepare.outputs.work_dir }}
      run: |
        set -euo pipefail

        echo "::group::Applying manifests to namespace '$NS'"

        APPLY_OPTS=("--namespace" "$NS")

        if [[ "$VALIDATE" == "true" ]]; then
          APPLY_OPTS+=("--validate=true")
        else
          APPLY_OPTS+=("--validate=false")
        fi

        if [[ "$DRY_RUN" != "none" ]]; then
          APPLY_OPTS+=("--dry-run=$DRY_RUN")
        fi

        if [[ "$PRUNE" == "true" ]]; then
          APPLY_OPTS+=("--prune" "-l" "$PRUNE_LABEL")
        fi

        TARGET_FLAG="-f"
        if [[ "$KUSTOMIZE" == "true" ]]; then
          TARGET_FLAG="-k"
        fi

        readarray -t LIST_ENTRIES < "$WORK_DIR/manifests.list"

        TARGETS=()

        for entry in "${LIST_ENTRIES[@]}"; do
          [[ -z "$entry" ]] && continue
          TARGETS+=("$entry")
        done

        if [[ ${#TARGETS[@]} -eq 0 ]]; then
          echo "::error::No manifest target to apply"
          exit 1
        fi

        STDERR_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/kubectl-apply.XXXXXX")"
        APPLIED=""

        apply_targets() {
          local args=()
          local target
          for target in "$@"; do
            args+=("$TARGET_FLAG" "$target")
          done

          local output=""
          local exit_code=0
          output="$(kubectl apply "${args[@]}" "${APPLY_OPTS[@]}" -o name 2>"$STDERR_FILE")" || exit_code=$?

          # kubectl warnings, for example about a deprecated API version, belong
          # in the log and not in the applied_resources output the callers
          # consume, so stderr is kept separate instead of folded in with 2>&1.
          if [[ -s "$STDERR_FILE" ]]; then
            cat "$STDERR_FILE" >&2
          fi

          if [[ -n "$output" ]]; then
            printf '%s\n' "$output"
            APPLIED+="$output"$'\n'
          fi

          return "$exit_code"
        }

        EXIT_CODE=0

        if [[ "$PRUNE" == "true" ]]; then
          # One invocation with a -f per manifest. --prune deletes everything
          # matching the selector that is not part of the set applied by the same
          # command, so applying file by file made each file prune the resources
          # of the files before it: only the last file survived and the deploy
          # still reported success.
          echo "Applying ${#TARGETS[@]} target(s) in a single kubectl invocation because prune is enabled:"
          printf ' - %s\n' "${TARGETS[@]}"

          apply_targets "${TARGETS[@]}" || EXIT_CODE=$?

          if [[ "$EXIT_CODE" -ne 0 ]]; then
            echo "::error::kubectl apply with --prune failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
        else
          for m in "${TARGETS[@]}"; do
            echo "Applying: $m"

            apply_targets "$m" || EXIT_CODE=$?

            if [[ "$EXIT_CODE" -ne 0 ]]; then
              echo "::error::kubectl apply failed for '$m' with exit code $EXIT_CODE"
              exit "$EXIT_CODE"
            fi
          done
        fi

        rm -f "$STDERR_FILE"

        # No trailing newline: it made the output look non-empty when nothing had
        # been applied.
        APPLIED="${APPLIED%$'\n'}"

        if [[ -z "$APPLIED" ]]; then
          echo "applied_resources=" >> "$GITHUB_OUTPUT"
        else
          # A random delimiter rather than a fixed EOF: a line of applied content
          # equal to the delimiter would end the value early and let the rest be
          # read as further step outputs.
          EOF_MARKER="applied_resources_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"

          {
            printf 'applied_resources<<%s\n' "$EOF_MARKER"
            printf '%s\n' "$APPLIED"
            printf '%s\n' "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
        fi

        echo "deployment_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

        echo "::endgroup::"

    - name: Update images
      shell: bash
      if: inputs.set_image != '' && inputs.dry_run == 'none'
      env:
        NS: ${{ inputs.namespace }}
        SET_IMAGE: ${{ inputs.set_image }}
      run: |
        set -euo pipefail

        echo "::group::Updating images via 'kubectl set image'"

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        while IFS= read -r line || [[ -n "$line" ]]; do
          line="$(trim "$line")"
          [[ -z "$line" ]] && continue

          if [[ "$line" != *"="*"="* ]]; then
            echo "::error::Invalid set_image entry '$line' (expected 'resource=container=image')"
            exit 1
          fi

          RESOURCE="${line%%=*}"
          REMAINDER="${line#*=}"
          CONTAINER="${REMAINDER%%=*}"
          IMAGE_VALUE="${REMAINDER#*=}"

          if [[ -z "$RESOURCE" ]] || [[ -z "$CONTAINER" ]] || [[ -z "$IMAGE_VALUE" ]] || [[ "$IMAGE_VALUE" == "$REMAINDER" ]]; then
            echo "::error::Invalid set_image entry '$line' (expected 'resource=container=image')"
            exit 1
          fi

          echo "Setting $RESOURCE container=$CONTAINER"
          kubectl --namespace "$NS" set image "$RESOURCE" "$CONTAINER=$IMAGE_VALUE"
        done <<< "$SET_IMAGE"

        echo "::endgroup::"

    - name: Wait for rollout
      id: rollout
      shell: bash
      env:
        NS: ${{ inputs.namespace }}
        WAIT: ${{ inputs.wait }}
        DRY_RUN: ${{ inputs.dry_run }}
        WAIT_RESOURCES: ${{ inputs.wait_resources }}
        WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
        APPLIED: ${{ steps.apply.outputs.applied_resources }}
      run: |
        set -euo pipefail

        echo "::group::Waiting for rollout (timeout: $WAIT_TIMEOUT)"

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        # The step is no longer skipped by an 'if' on wait and dry_run: a skipped
        # step produces no output, so rollout_status came back as the empty string
        # instead of one of the three documented values.
        if [[ "$DRY_RUN" != "none" ]]; then
          echo "dry_run is '$DRY_RUN', so nothing reached the cluster: not waiting"
          echo "rollout_status=skipped" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit 0
        fi

        if [[ "$WAIT" != "true" ]]; then
          echo "wait is '$WAIT': not waiting"
          echo "rollout_status=skipped" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit 0
        fi

        RESOURCES=()

        if [[ -n "$WAIT_RESOURCES" ]]; then
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(trim "$line")"
            [[ -z "$line" ]] && continue
            RESOURCES+=("$line")
          done <<< "$WAIT_RESOURCES"
        else
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(trim "$line")"
            [[ -z "$line" ]] && continue

            if [[ "$line" =~ ^deployment(\.apps)?/.+ ]] || \
               [[ "$line" =~ ^statefulset(\.apps)?/.+ ]] || \
               [[ "$line" =~ ^daemonset(\.apps)?/.+ ]]; then
              RESOURCES+=("$line")
            fi
          done <<< "$APPLIED"
        fi

        if [[ ${#RESOURCES[@]} -eq 0 ]]; then
          echo "No rollout-capable resource among the resources applied by this run, nothing to wait for"
          echo "rollout_status=skipped" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit 0
        fi

        STATUS="success"

        for r in "${RESOURCES[@]}"; do
          echo "Waiting for $r"

          if ! kubectl --namespace "$NS" rollout status "$r" --timeout="$WAIT_TIMEOUT"; then
            echo "::error::Rollout failed for $r"
            kubectl --namespace "$NS" describe "$r" || true
            STATUS="failed"
          fi
        done

        echo "rollout_status=$STATUS" >> "$GITHUB_OUTPUT"

        if [[ "$STATUS" == "failed" ]]; then
          echo "::endgroup::"
          exit 1
        fi

        echo "::endgroup::"

    - name: Cleanup
      shell: bash
      if: always()
      env:
        WORK_DIR: ${{ steps.prepare.outputs.work_dir }}
        KUBECONFIG_PATH: ${{ steps.kubeconfig.outputs.path }}
      run: |
        set -euo pipefail

        echo "::group::Cleanup"

        # Only paths this run created under the temp root are removed, and both
        # checks tolerate a step that never ran and a second cleanup pass.
        TEMP_ROOT="${RUNNER_TEMP:-/tmp}"

        if [[ -n "${KUBECONFIG_PATH:-}" ]] && [[ "$KUBECONFIG_PATH" == "$TEMP_ROOT"/* ]]; then
          rm -f -- "$KUBECONFIG_PATH"
        fi

        # The variable goes with the file. Leaving KUBECONFIG pointing at a
        # deleted path made any later kubectl in the caller's job fail against
        # localhost:8080, which says nothing about the real cause. The action
        # deliberately leaves no usable KUBECONFIG behind.
        echo "KUBECONFIG=" >> "$GITHUB_ENV"

        if [[ -n "${WORK_DIR:-}" ]] && [[ "$WORK_DIR" == "$TEMP_ROOT"/* ]] && [[ -d "$WORK_DIR" ]]; then
          rm -rf -- "$WORK_DIR"
        fi

        # The kubectl and envsubst directories are deliberately left in place:
        # they are on PATH for the rest of the caller's job and hold no secret.
        # The runner deletes RUNNER_TEMP when the job ends.

        echo "Cleanup completed"
        echo "::endgroup::"
